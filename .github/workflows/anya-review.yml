name: anya-review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [review_requested]

jobs:
  anya-review:
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.requested_reviewer.login == 'anya-research'
      ) || (
        github.event.comment.user.login != 'anya-research' &&
        github.event.comment.user.login != 'yuki-fuyutsuki' &&
        contains(github.event.comment.body, '/anya review')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Anya Review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ANYA_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          use_github_token: true
          mentions: "/anya"
          share: false
          prompt: |
            You are Anya, a maintainer of CONTINUUM reviewing a pull request.
            Write exactly like a senior human maintainer. No templates, no filler,
            no bot phrasing, no praise padding. Vary every review: pick the shape
            below that fits the situation and word it fresh each time.

            Shapes (choose one):
            - Clean approval: a few warm lines. Thank the contributor, say what
              the change does, name what you checked, confirm nothing blocks.
            - Findings review: thank them, state what you read end to end and
              what you ran to verify, then list each required change before any
              optional notes.
            - First-timer review: welcome them warmly, keep the required list
              short and mechanical, give exact replacement text, say no extra
              tests are needed when none are, invite them back.
            - Re-review: acknowledge what got fixed since last time by name,
              then cover only what remains.

            Rules for findings, most severe first:
            - State the file path and line number in backticks on its own line.
            - Explain the concrete failure mode in two to four sentences: what
              happens, where, and why it is wrong in practice.
            - When the fix is a concrete replacement, append a GitHub suggestion
              block with ONLY the corrected lines, matching indentation exactly:

            ```suggestion
            raise OSError(error_msg.format(origin, e.code, e.msg)) from e
            ```

            - Report only real, actionable issues: correctness bugs, broken error
              paths, resource leaks, races, security problems, regressions, API
              misuse. Never report style nits, naming taste, or anything linters
              already catch. Never invent an issue to seem thorough. If the diff
              is clean, say so plainly and note one thing done well.
            - Verify before you claim: read the changed files plus callers and
              tests around them. If evidence is thin, say what is unproven
              instead of guessing.
            - House style, no exceptions: never use em dashes or en dashes
              anywhere, not in prose, code, or suggestions (banned codepoints
              U+2014 and U+2013). Use commas, periods, or parentheses.
              Never use emojis. Keep it under 600 words unless findings demand
              more.

            Finish with exactly one verdict line and nothing after it:
            VERDICT: APPROVE when no high or medium findings remain, or
            VERDICT: REQUEST_CHANGES when any high or medium finding stands.
            Low severity findings never block approval.

      - name: Scrub banned characters from review text
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ANYA_TOKEN }}
        run: |
          set -uo pipefail
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            PR="${{ github.event.issue.number }}"
          fi
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No PR number in event, skipping scrub."
            exit 0
          fi
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq '[.[] | select(.user.login == "anya-research") | .id] | last // empty')
          if [ -z "$ID" ]; then
            echo "No Anya comment found, skipping scrub."
            exit 0
          fi
          BODY=$(gh api "repos/${{ github.repository }}/issues/comments/$ID" --jq .body)
          CLEAN=$(printf '%s' "$BODY" | python3 -c "import sys,re; t=sys.stdin.read(); t=re.sub(r'(?m)^\[github run\]\(.*\)\s*', '', t); t=t.replace('—', ',').replace('–', '-'); sys.stdout.write(t.rstrip() + chr(10))")
          if [ "$CLEAN" != "$BODY" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$ID" -X PATCH -f body="$CLEAN" --jq .id
            echo "Scrubbed banned dash characters from comment $ID."
          else
            echo "Comment $ID already clean."
          fi

      - name: Submit formal review state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ANYA_TOKEN }}
        run: |
          set -uo pipefail
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            PR="${{ github.event.issue.number }}"
          fi
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No PR number in event, skipping formal review."
            exit 0
          fi
          HEAD_SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          LATEST=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.author.login == "anya-research") | .body] | last // ""')
          if printf '%s' "$LATEST" | grep -q 'VERDICT: REQUEST_CHANGES'; then
            EVENT=REQUEST_CHANGES
          elif printf '%s' "$LATEST" | grep -q 'VERDICT: APPROVE'; then
            EVENT=APPROVE
          else
            echo "No verdict line in latest Anya comment, skipping formal review."
            exit 0
          fi
          gh api "repos/${{ github.repository }}/pulls/$PR/reviews" \
            -X POST \
            -f commit_id="$HEAD_SHA" \
            -f event="$EVENT" \
            -f body="Formal review state for the Anya review above. See the full findings and suggestion blocks in the review comment." \
            --jq '{id, state}'

      - name: Auto-merge docs-only approvals
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ANYA_TOKEN }}
        run: |
          set -uo pipefail
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            PR="${{ github.event.issue.number }}"
          fi
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No PR number in event, skipping auto-merge."
            exit 0
          fi
          LATEST=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.author.login == "anya-research") | .body] | last // ""')
          if ! printf '%s' "$LATEST" | grep -q 'VERDICT: APPROVE'; then
            echo "No APPROVE verdict, skipping auto-merge."
            exit 0
          fi
          DOCSONLY=$(gh pr view "$PR" --json files --jq '[.files[].path] | length > 0 and all(test("\\.md$|^docs/|^references/"))')
          if [ "$DOCSONLY" != "true" ]; then
            echo "Non-docs files present, skipping auto-merge."
            exit 0
          fi
          gh pr merge "$PR" --auto --squash
          echo "Auto-merge enabled for docs-only PR #$PR."
