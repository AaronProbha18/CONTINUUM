name: anya-review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [review_requested]

jobs:
  anya-review:
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.requested_reviewer.login == 'anya-research'
      ) || (
        github.event.comment.user.login != 'anya-research' &&
        github.event.comment.user.login != 'yuki-fuyutsuki' &&
        contains(github.event.comment.body, '/anya review')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Anya Review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ANYA_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          use_github_token: true
          mentions: "/anya"
          share: false
          prompt: |
            You are performing a rigorous code review of this pull request, in the style of a senior staff engineer. The user request is the comment text; the pull request diff is available in the repository context.

            Structure your response exactly like this:

            **Code Review**

            One paragraph summarizing what this PR changes and your overall assessment of its quality.

            Then one section per finding, ordered from most to least severe. Each finding must have:

            - A severity label on its own line: one of **high**, **medium**, or **low**
            - The file path (and line number when known) in backticks
            - Two to four sentences explaining the problem and why it matters in practice

            - When the fix is a concrete code replacement, append a GitHub suggestion block so maintainers can apply it with one click. Use a fenced code block tagged `suggestion` containing ONLY the corrected replacement lines, matching the surrounding indentation exactly. Example:

            ```suggestion
            raise OSError(error_msg.format(origin, e.code, e.msg)) from e
            ```

            Rules for findings:
            - Report only real, actionable issues: correctness bugs, broken exception handling (for example wrapping exceptions without preserving context), resource leaks, race conditions, security problems, performance regressions, API misuse, missing error paths.
            - Do NOT report style nits, formatting, naming preferences, or anything linters already catch.
            - Do NOT invent issues to seem thorough. If the diff is clean, say so explicitly and briefly note what was done well.
            - Keep the whole review under 600 words unless there are many findings.

            Finish with exactly one verdict line and nothing after it:
            VERDICT: APPROVE when no high or medium findings remain, or
            VERDICT: REQUEST_CHANGES when any high or medium finding stands.
            Low severity findings never block approval. Write like a maintainer:
            direct, specific, no filler, no praise padding.

      - name: Submit formal review state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ANYA_TOKEN }}
        run: |
          set -uo pipefail
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            PR="${{ github.event.issue.number }}"
          fi
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No PR number in event, skipping formal review."
            exit 0
          fi
          HEAD_SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          LATEST=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.author.login == "anya-research") | .body] | last // ""')
          if printf '%s' "$LATEST" | grep -q 'VERDICT: REQUEST_CHANGES'; then
            EVENT=REQUEST_CHANGES
          elif printf '%s' "$LATEST" | grep -q 'VERDICT: APPROVE'; then
            EVENT=APPROVE
          else
            echo "No verdict line in latest Anya comment, skipping formal review."
            exit 0
          fi
          gh api "repos/${{ github.repository }}/pulls/$PR/reviews" \
            -X POST \
            -f commit_id="$HEAD_SHA" \
            -f event="$EVENT" \
            -f body="Formal review state for the Anya review above. See the full findings and suggestion blocks in the review comment."
            --jq '{id, state}'
